# Collect conditions about every 3 hours, score them, and publish everything to Supabase.
# This file must live at .github/workflows/collect.yml to take effect
# (see COMMANDS.md, section 8, for the copy command).
#
# Why it fires every hour: GitHub starts scheduled workflows late and drops
# many of them (2 of about 8 ran in the first day). So it is triggered hourly,
# and the "Is it time?" step skips the run unless at least 170 minutes have
# passed since the last publish. The data sources are still asked about once
# every 3 hours. Runs started by hand always go ahead.
name: Collect

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17 (UTC)
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Acceptance test only: make one source fail (linz_tides, open_meteo_forecast, open_meteo_marine, ecan_flow)"
        required: false
        default: ""
      break_output:
        description: "Acceptance test only: type 1 to write an output file that breaks the schema"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Is it time?
        id: due
        run: python -m publish.run due --min-minutes 170 ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Fetch last run's state
        if: steps.due.outputs.run == 'true'
        run: python -m publish.run pull --out out
      - name: Collect
        if: steps.due.outputs.run == 'true'
        env:
          FISHING_FORCE_FAIL: ${{ inputs.force_fail }}
          FISHING_BREAK_OUTPUT: ${{ inputs.break_output }}
        run: python -m collector.run --out out
      - name: Score
        if: steps.due.outputs.run == 'true'
        run: python -m scorer.run --out out
      - name: Validate and publish
        if: steps.due.outputs.run == 'true'
        run: python -m publish.run push --out out
